<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml"
      onload="Zotero.ZotLink.initializePreferencePane(document);"
      onpageshow="Zotero.ZotLink.initializePreferencePane(document);">
	<linkset>
		<html:link rel="localization" href="zotlink.ftl"/>
	</linkset>

	<groupbox flex="1">
		<label><html:h2>ZotLink 附件移动</html:h2></label>
		<html:p style="max-width: 720px; margin: 0 0 16px 0;">
			按当前 collection 层级移动链接附件，并同步更新 Zotero 的链接附件路径。设置会在输入后自动保存。
		</html:p>

		<vbox style="max-width: 720px;">
			<vbox style="margin-bottom: 12px;">
				<label value="附件顶层路径"/>
				<html:input id="zotlink-move-root"
				            style="width: 100%; box-sizing: border-box; margin-top: 4px;"
				            placeholder="D:\OneDrive\Zotero"/>
			</vbox>

			<vbox style="margin-bottom: 18px;">
				<label value="移动快捷键"/>
				<html:input id="zotlink-move-shortcut"
				            style="width: 240px; max-width: 100%; box-sizing: border-box; margin-top: 4px;"
				            placeholder="点击后按快捷键，如 Ctrl+Alt+M"
				            onkeydown="Zotero.ZotLink.captureShortcutInput(event, this);"/>
				<label id="zotlink-current-shortcut"
				       value=""
				       style="margin-top: 4px;"/>
			</vbox>

			<vbox style="margin-bottom: 18px;">
				<label value="文件操作时自动处理"/>
				<checkbox id="zotlink-auto-write-doi-metadata"
				          label="写入 PDF DOI 与 DOI URL 元数据"/>
				<checkbox id="zotlink-auto-align-page-labels"
				          label="对齐主 PDF 页码标签"/>
				<checkbox id="zotlink-auto-set-open-first-page"
				          label="将 PDF 打开页面设置为首页"/>
				<checkbox id="zotlink-auto-display-title-filename"
				          label="将 PDF 显示标题设置为文件名"/>
				<checkbox id="zotlink-auto-extract-article-history"
				          label="识别英文期刊文章投稿历史并写入 Extra"/>
			</vbox>

			<vbox>
				<hbox style="margin-bottom: 8px;">
					<button id="zotlink-index-all-attachments"
					        label="初始化全库附件机内码"
					        oncommand="Zotero.ZotLink.handlePreferenceAction('indexAllAttachments', this);"/>
				</hbox>
				<hbox style="margin-bottom: 8px;">
					<button id="zotlink-write-all-pdf-doi-metadata"
					        label="写入全库 PDF DOI 元数据并对齐页码"
					        oncommand="Zotero.ZotLink.handlePreferenceAction('writeAllPDFDOIMetadata', this);"/>
				</hbox>
				<hbox style="margin-bottom: 8px;">
					<button id="zotlink-write-all-article-history"
					        label="提取全库文章历史时间线"
					        oncommand="Zotero.ZotLink.handlePreferenceAction('writeAllArticleHistory', this);"/>
				</hbox>
				<hbox>
					<button id="zotlink-import-root-pdf-library"
					        label="从顶层文件夹重建链接库"
					        oncommand="Zotero.ZotLink.handlePreferenceAction('importRootPDFLibrary', this);"/>
				</hbox>
			</vbox>
		</vbox>
	</groupbox>
</vbox>
